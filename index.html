<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>MercadoHub</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23f0a500'/%3E%3Ctext x='16' y='23' font-size='18' font-weight='800' text-anchor='middle' fill='%23000' font-family='sans-serif'%3EM%3C/text%3E%3C/svg%3E"/>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Syne:wght@600;700;800&display=swap" rel="stylesheet"/>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#080c10;--bg1:#0d1219;--bg2:#111820;--bg3:#16202b;--border:#1c2d40;--text:#c4d8ec;--hi:#e8f4ff;--dim:#6a8aa8;--faint:#3d5368;--gold:#f0a500;--green:#22c55e;--red:#ef4444;--blue:#3b9eff}
html,body{background:var(--bg);color:var(--text);font-family:'Syne',system-ui,sans-serif;min-height:100vh}
.m{font-family:'IBM Plex Mono',ui-monospace,monospace}
button,input,select{font:inherit;color:inherit}
.hdr{background:var(--bg1);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
.hdr-top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px}
.logo-m{width:30px;height:30px;border-radius:7px;background:var(--gold);display:flex;align-items:center;justify-content:center;font-weight:800;color:#000;font-size:15px}
.logo-n{font-size:17px;font-weight:800;color:var(--hi)}.logo-n span{color:var(--gold)}
.strip{display:flex;gap:18px;flex-wrap:wrap}
.strip-i{display:flex;flex-direction:column;align-items:flex-end}
.strip-l{font-size:10px;color:var(--dim);letter-spacing:.06em;text-transform:uppercase}
.strip-v{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--hi)}
.tabs{display:flex;gap:2px;overflow-x:auto}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:none;border-bottom:2px solid transparent;padding:9px 14px 11px;font-size:13px;font-weight:700;color:var(--dim);cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--text)}.tab.on{color:var(--gold);border-bottom-color:var(--gold)}
main{padding:20px 0 60px}
.card{background:var(--bg1);border:1px solid var(--border);border-radius:10px;padding:16px}
.card h3{font-size:12px;font-weight:700;color:var(--dim);text-transform:uppercase;letter-spacing:.07em;margin-bottom:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.stack>*+*{margin-top:14px}
.inp{background:var(--bg2);border:1px solid var(--border);border-radius:7px;padding:9px 11px;font-size:14px;color:var(--hi);min-width:0}
.inp:focus{outline:none;border-color:var(--gold)}
.inp::placeholder{text-transform:none;color:var(--faint)}
.inp.sm{padding:5px 7px;font-size:12px;width:84px;font-family:'IBM Plex Mono',monospace}
.btn{background:var(--bg2);border:1px solid var(--border);color:var(--text);padding:8px 13px;border-radius:7px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--gold);color:var(--gold)}
.btn.pri{background:var(--gold);border-color:var(--gold);color:#000}.btn.pri:hover{filter:brightness(1.1);color:#000}
.btn.on{border-color:var(--gold);color:var(--gold)}
.btn.x{padding:3px 8px;color:var(--faint)}.btn.x:hover{color:var(--red);border-color:var(--red)}
.chip{background:var(--bg2);border:1px solid var(--border);border-radius:99px;padding:3px 10px;font-size:11px;font-family:'IBM Plex Mono',monospace;color:var(--dim);cursor:pointer}
.chip:hover{color:var(--gold);border-color:var(--gold)}
.pos{color:var(--green)}.neg{color:var(--red)}.dim{color:var(--dim)}.faint{color:var(--faint)}
.big{font-family:'IBM Plex Mono',monospace;font-size:30px;font-weight:600;color:var(--hi)}
.tk{font-size:22px;font-weight:800;color:var(--hi)}
.badge{display:inline-block;padding:3px 8px;border-radius:5px;font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600}
.badge.pos{background:rgba(34,197,94,.12)}.badge.neg{background:rgba(239,68,68,.12)}
.kv{display:grid;grid-template-columns:1fr auto;gap:7px 14px;font-size:13px}
.kv dt{color:var(--dim)}.kv dd{font-family:'IBM Plex Mono',monospace;color:var(--hi);text-align:right}
.tbl-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:right;color:var(--dim);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.05em;padding:9px 10px;background:var(--bg2);white-space:nowrap}
td{text-align:right;padding:8px 10px;border-top:1px solid var(--border);font-family:'IBM Plex Mono',monospace;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
tr.alert td{background:rgba(240,165,0,.07)}
.link{background:none;border:none;color:var(--hi);font-weight:700;cursor:pointer;font-family:'IBM Plex Mono',monospace}
.link:hover{color:var(--gold)}
.stat .l{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
.stat .v{font-family:'IBM Plex Mono',monospace;font-size:20px;color:var(--hi);margin-top:6px}
.stat .s{font-family:'IBM Plex Mono',monospace;font-size:12px;margin-top:4px}
.note{font-size:12px;color:var(--dim);line-height:1.55}
.msg{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--faint);padding:24px;text-align:center}
.err{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--red);padding:10px 0}
.chart-box{position:relative;width:100%}
.tip{position:absolute;pointer-events:none;background:var(--bg3);border:1px solid var(--border);border-radius:6px;padding:6px 9px;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--hi);white-space:nowrap;transform:translate(-50%,-110%)}
.graham{border:1px dashed var(--border);border-radius:8px;padding:12px;margin-top:14px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;align-items:end}
.form label{display:flex;flex-direction:column;gap:5px;font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.05em}
.seg{display:flex;gap:4px;flex-wrap:wrap}
@media (max-width:600px){.big{font-size:24px}.strip{gap:12px}.strip-i{align-items:flex-start}.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="root"></div>
<script>

  cache:{},

  {t:'ITUB4',alvo:51},{t:'GGBR4',alvo:28.58},{t:'SBSP3',alvo:34.86},{t:'CURY3',alvo:42},{t:'EMBJ3',alvo:111},
  {t:'VIVT3',alvo:37.89},{t:'CXSE3',alvo:25},{t:'SUZB3',alvo:63},{t:'LREN3',alvo:17.5},{t:'RDOR3',alvo:null},{t:'WEGE3',alvo:56}

// ── Formatação ───────────────────────────────────────────────
function brl(v,d){if(v==null||isNaN(v))return'—';d=d==null?2:d;return Number(v).toLocaleString('pt-BR',{style:'currency',currency:'BRL',minimumFractionDigits:d,maximumFractionDigits:d});}

// ── Cálculos ─────────────────────────────────────────────────
function lastBars(q){return q&&q.series?q.series:[];}

function closeOn(series,dateStr){var lim=Date.parse(dateStr+'T23:59:59-03:00')/1000,v=null;for(var i=0;i<series.length;i++){if(series[i].t<=lim)v=series[i].c;else break;}return v!=null?v:(series.length?series[0].c:null);}
function positions(trades){

  trades.slice().sort(function(a,b){return a.d<b.d?-1:a.d>b.d?1:0;}).forEach(function(tr){
    var p=map[tr.t]||(map[tr.t]={t:tr.t,qtd:0,custo:0,realizado:0});
    var fee=tr.fee||0;

  });

}

// ── Componentes base ─────────────────────────────────────────

function niceTicks(min,max,n){var span=max-min||Math.abs(max)||1,step=Math.pow(10,Math.floor(Math.log10(span/n))),err=span/n/step;step*=err>=7.5?10:err>=3.5?5:err>=1.5?2:1;var out=[];for(var v=Math.ceil(min/step)*step;v<=max+1e-9;v+=step)out.push(v);return out;}

  var xt=[];for(var k=0;k<5;k++)xt.push(Math.round(k/4*(data.length-1)));

  var gid='g'+(p.id||'c');

    h('svg',{width:W,height:H,style:{display:'block'}},
      h('defs',null,h('linearGradient',{id:gid,x1:0,y1:0,x2:0,y2:1},h('stop',{offset:'0%',stopColor:up?'#22c55e':'#ef4444',stopOpacity:.22}),h('stop',{offset:'100%',stopColor:up?'#22c55e':'#ef4444',stopOpacity:0}))),
      ticks.map(function(v){return h('g',{key:'y'+v},h('line',{x1:L,x2:L+iw,y1:y(v),y2:y(v),stroke:'#1c2d40',strokeDasharray:'2 4'}),h('text',{x:L+iw+8,y:y(v)+4,fill:'#6a8aa8',fontSize:11,fontFamily:'IBM Plex Mono'},nf(v,v>=100?0:2)));}),
      xt.map(function(i,k){return h('text',{key:'x'+k,x:x(i),y:H-6,fill:'#6a8aa8',fontSize:11,fontFamily:'IBM Plex Mono',textAnchor:k===0?'start':k===4?'end':'middle'},dtShort(data[i].t,long));}),
      h('path',{d:area,fill:'url(#'+gid+')'}),
      h('path',{d:d,fill:'none',stroke:col,strokeWidth:1.8,strokeLinejoin:'round'}),
      hi!=null&&h('g',null,h('line',{x1:x(hi),x2:x(hi),y1:T,y2:T+ih,stroke:'#6a8aa8',strokeDasharray:'3 3'}),h('circle',{cx:x(hi),cy:y(data[hi].c),r:4,fill:col,stroke:'#080c10',strokeWidth:2}))
    ),
    hi!=null&&h('div',{className:'tip',style:{left:Math.min(Math.max(x(hi),70),W-70),top:y(data[hi].c)}},dt(data[hi].t)+'  '+brl(data[hi].c))

}
function Stat(p){return h('div',{className:'card stat'},h('div',{className:'l'},p.l),h('div',{className:'v'},p.v),p.s!=null&&h('div',{className:'s '+(p.sc||'dim')},p.s));}

// ── Aba Ativo ────────────────────────────────────────────────
var RANGES=[{id:'1mo',l:'1M'},{id:'6mo',l:'6M'},{id:'1y',l:'1A'},{id:'2y',l:'2A'},{id:'5y',l:'5A'}];
function AtivoTab(p){

  var s2=useState('1y'),range=s2[0],setRange=s2[1];

    h('form',{className:'row',onSubmit:go},
      h('input',{className:'inp',style:{flex:'1 1 200px',maxWidth:340,textTransform:'uppercase'},value:q,placeholder:'Digite o ticker (ex.: ITUB4)',onChange:function(e){setQ(e.target.value);}}),
      h('button',{className:'btn pri',type:'submit'},'Buscar'),
      h('div',{className:'row',style:{gap:6}},watchSet.slice(0,12).map(function(w){return h('button',{key:w,type:'button',className:'chip',onClick:function(){p.onTicker(w);}},w);}))
    ),
    t?h(AtivoView,{key:t,t:t,range:range,setRange:setRange,inWatch:watchSet.indexOf(t)>=0,onWatch:p.onWatch,onTrade:p.onTrade}):h('div',{className:'msg'},'Digite um ticker para começar.')

}
function AtivoView(p){

    h('div',{className:'card'},
      h('div',{className:'row',style:{justifyContent:'space-between',alignItems:'flex-start'}},
        h('div',null,

          h('div',{className:'row',style:{marginTop:8,alignItems:'baseline'}},h('span',{className:'big'},brl(d.price)),h('span',{className:'badge '+cls(chg)},pct(chg))),
          h('div',{className:'note m',style:{marginTop:6}},d.time?'Última cotação: '+dtHora(d.time)+' · pode ter atraso de até 15 min':'')

    h('div',{className:'card'},
      h('div',{className:'row',style:{justifyContent:'space-between',marginBottom:10}},
        h('div',{className:'seg'},RANGES.map(function(r){return h('button',{key:r.id,className:'btn'+(p.range===r.id?' on':''),onClick:function(){p.setRange(r.id);}},r.l);})),
        h('span',{className:'m '+cls(rangeChg),style:{fontSize:13}},rangeChg!=null?'Variação no período: '+pct(rangeChg):'')

    ),
    h('div',{className:'grid2'},
      h('div',{className:'card'},h('h3',null,'Negociação'),
        h('dl',{className:'kv'},
          h('dt',null,'Abertura'),h('dd',null,brl(last.o)),
